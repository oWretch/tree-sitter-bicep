name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: '24'
      - name: Install modules
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Validate commit messages
        run: >-
          npx commitlint --from "${{github.event.pull_request.base.sha}}"
          --to "${{github.event.pull_request.head.sha}}"
      - name: Validate pull request title
        env:
          PR_TITLE: ${{github.event.pull_request.title}}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: ${{vars.NODE_VERSION}}
      - name: Install modules
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      - name: Install yamllint
        run: python -m pip install yamllint==1.37.1
      - name: Run yamllint
        run: >-
          yamllint -d '{extends: relaxed, rules: {line-length: disable,
          document-start: disable, truthy: disable}}' .github/workflows
      - name: Run actionlint
        uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1.73.1
        with:
          fail_level: error
